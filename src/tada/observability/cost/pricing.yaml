currency: USD
unit: per_1m_tokens

# Decimal values are written as strings to avoid precision errors resulting from pyyaml auto-conversion to float
#
# OpenAI/Anthropic entries are intentionally not included yet — add them by hand
# with a verified `source` URL once real pricing is confirmed. Until then,
# `safe_calculate_cost` degrades gracefully for unpriced models (returns a
# `CostFailure` instead of raising), so cost tracking just reports "unavailable"
# for those models.
#
# DeepSeek pricing below is the current flat rate confirmed against the official
# docs. Note: DeepSeek has announced (but not yet enabled, as of this writing) a
# peak/off-peak pricing policy that will double these rates during Beijing
# business hours (09:00-12:00, 14:00-18:00) — this schema has no notion of
# time-of-day pricing, so cost figures will under-report once that goes live.
pricing:
  gemini-2.5-flash-lite:
    input_cost_per_1m: "0.1"
    output_cost_per_1m: "0.4"
    cached_input_cost_per_1m: "0.01"
    thoughts_cost_per_1m: "0.4"
    effective_from: "2026-04-01"
    source: "https://ai.google.dev/gemini-api/docs/pricing"

  gemini-2.5-flash:
    input_cost_per_1m: "0.3"
    output_cost_per_1m: "2.5"
    cached_input_cost_per_1m: "0.03"
    thoughts_cost_per_1m: "2.5"
    effective_from: "2026-04-01"
    source: "https://ai.google.dev/gemini-api/docs/pricing"

  gemini-2.5-pro:
    input_cost_per_1m: "1.25"
    output_cost_per_1m: "10.0"
    cached_input_cost_per_1m: "0.125"
    thoughts_cost_per_1m: "10.0"
    max_prompt_tokens: 200000
    cache_storage_cost_per_1m_tokens_per_hr: "4.5"
    effective_from: "2026-04-01"
    source: "https://ai.google.dev/gemini-api/docs/pricing"

  gemini-3-flash-preview:
    input_cost_per_1m: "0.50"
    output_cost_per_1m: "3.0"
    cached_input_cost_per_1m: "0.05"
