[project]
name = "tableau-metadata-agent"
version = "0.1.0"
description = "An LLM-driven CLI tool for working with Tableau workbooks, with a focus on generating standardized documentation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastparquet>=2026.5.0",
  "google-genai>=1.73.1",
  "grandalf>=0.8",          # Used to draw ascii graph in logs
  "langchain>=1.3.1",
  "langgraph>=1.1.8",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "lxml>=6.1.0",
  "lxml-stubs>=0.5.1",
  "openinference-instrumentation-google-genai>=1.0.2",
  "openinference-instrumentation-langchain>=0.1.66",
  "opentelemetry-sdk>=1.41.1",
  "pandas>=3.0.3",
  "platformdirs>=4.9.6",
  "prompt-toolkit>=3.0.52",
  "pyarrow>=24.0.0",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.1",
  "questionary>=2.1.1",
  "rich>=15.0.0",
  "typer>=0.24.1",
]

[dependency-groups]
dev = ["commitizen>=4.8.3", "pre-commit>=4.5.1", "pytest>=9.0.3"]

[project.scripts]
tada = "tada.cli.app:main"

[project.optional-dependencies]
trace-viewer = [
    "arize-phoenix>=15.10.1",
]

# Using hatchling for a modern, pyproject.toml-first build with minimal boilerplate.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tada"]
include = ["src/tada/prompts/**/*.md", "src/tada/observability/**/*.yaml"]

[tool.hatch.build.targets.sdist]
include = ["src/tada/prompts/**/*.md", "src/tada/observability/**/*.yaml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast isolated unit tests",
  "integration: tests that use packaged files or multiple components",
]

# Commitizen is an optional tool for helping to write commitlint compliant commits.
[tool.commitizen]
name = "cz_conventional_commits"
