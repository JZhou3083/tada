[project]
name = "tableau-metadata-agent"
version = "0.1.0"
description = "An LLM-driven CLI tool for working with Tableau workbooks, with a focus on generating standardized documentation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grandalf>=0.8", # Used to draw ascii graph in logs
    "langgraph>=1.1.8",
    "lxml>=6.1.0",
    "lxml-stubs>=0.5.1",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.24.1",
]

[dependency-groups]
dev = ["commitizen>=4.8.3", "pre-commit>=4.5.1"]

[project.scripts]
tada = "tada.cli.app:main"

# Using hatchling for a modern, pyproject.toml-first build with minimal boilerplate.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tada"]

# Commitizen is an optional tool for helping to write commitlint compliant commits.
[tool.commitizen]
name = "cz_conventional_commits"
